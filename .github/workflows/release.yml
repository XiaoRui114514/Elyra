name: Publish verified CI artifact
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful build workflow run ID for the tagged commit
        required: true
      tag:
        description: Existing version tag (v*)
        required: true
permissions:
  contents: write
  actions: read
jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      RUN_ID: ${{ inputs.run_id }}
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify source run and tag match
        run: python3 scripts/verify_release_run.py
      - name: Download artifact and verify hashes
        run: |
          # Artifact APIs can return transient 502s. Each bounded retry has a fresh
          # directory so a partial download cannot be mistaken for a valid artifact.
          downloaded=false
          for attempt in 1 2 3; do
            artifact_dir="$(mktemp -d "$RUNNER_TEMP/elyra-release.XXXXXX")"
            if gh run download "$RUN_ID" --name "Elyra-unsigned-$VERIFIED_SHA" --dir "$artifact_dir"; then
              mv "$artifact_dir" build
              downloaded=true
              break
            fi
            rm -rf "$artifact_dir"
            sleep "$((attempt * 3))"
          done
          [[ "$downloaded" == true ]] || exit 1
          (cd build && sha256sum --check SHA256SUMS)
          python3 scripts/verify_ipa.py build/Elyra-unsigned.ipa
      - name: Create draft release for installation review
        run: |
          gh release create "$RELEASE_TAG" --verify-tag --draft --title "Elyra $RELEASE_TAG" --notes-file docs/RELEASE_NOTES.md build/Elyra-unsigned.ipa build/SHA256SUMS build/ipa-report.json build/Elyra.entitlements
